name: CI/CD

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ecoknock
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: Asia/Seoul
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres -d ecoknock"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:latest
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # 테스트 전용 더미값이다. 실제 비밀값을 넣지 않는다.
      DEV_POSTGRES_HOST: localhost
      DEV_POSTGRES_PORT: "5432"
      DEV_POSTGRES_USERNAME: postgres
      DEV_POSTGRES_PASSWORD: postgres
      DEV_REDIS_HOST: localhost
      DEV_REDIS_PORT: "6379"
      ADMIN_MASTER_PASSWORD: ci-admin-password
      JWT_SECRET_KEY: ci-dummy-jwt-secret-key-that-is-long-enough-for-hmac-sha256-0000
      AES256_KEY: 0123456789abcdef0123456789abcdef
      WALLET_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SEPOLIA_RPC_URL: http://localhost:8545
      SEPOLIA_KRT_TOKEN_ADDRESS: "0x0000000000000000000000000000000000000001"
      SEPOLIA_REWARD_DISTRIBUTOR_ADDRESS: "0x0000000000000000000000000000000000000002"
      SEPOLIA_REWARD_OPERATOR_PRIVATE_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
      SSO_CLIENT_ID: ci-sso-client
      WHOZIN_TOKEN: ci-whozin-token
      EMBEDDED_SERVER_HOST: localhost
      EMBEDDED_SERVER_GRPC_PORT: "6565"
      AI_SERVER_HOST: http://localhost:8000
      PROD_THIS_SERVER_URL: http://localhost:18081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run tests
        run: ./gradlew --no-daemon test

  docker-build:
    name: Docker build check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/prod/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 테스트 결과는 참고용이다. 테스트가 실패해도 이미지 publish와 배포는 막지 않는다.
  publish:
    name: Publish image
    if: >-
      github.repository == 'JNU-econovation/eco-knock-be-central' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/prod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: image
        name: Resolve immutable image tag
        run: |
          image="${IMAGE_NAME,,}:sha-${GITHUB_SHA::7}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

apiVersion: 1

# uid 없이 프로비저닝된 기존 datasource를 지우고 uid를 고정해 다시 만든다.
# 대시보드는 이 uid(prometheus)로 datasource를 참조한다.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

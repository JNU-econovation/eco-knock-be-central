name: eco-knock-prod

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile
    image: ${APP_IMAGE:-eco-knock-be-central:prod}
    container_name: eco-knock-prod-app
    env_file:
      - ../../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "${PROD_SERVER_PORT:-18081}:18081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: eco-knock-prod-postgres
    environment:
      POSTGRES_DB: ecoknock
      POSTGRES_USER: ${PROD_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${PROD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: eco-knock-prod-redis
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "${PROD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: eco-knock-prod-prometheus
    environment:
      EMBEDDED_SERVER_HOST: ${EMBEDDED_SERVER_HOST}
      PROD_THIS_SERVER_URL: ${PROD_THIS_SERVER_URL}
      PROD_GRAFANA_HOST: ${PROD_GRAFANA_HOST}
      AI_SERVER_HOST: ${AI_SERVER_HOST}
    command:
      - --storage.tsdb.retention.time=60d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../shared/prometheus/startup.sh:/etc/prometheus/startup.sh:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
    entrypoint: [ "sh", "/etc/prometheus/startup.sh" ]
    restart: unless-stopped

  # 호스트 네트워크·프로세스 지표를 그대로 보려면 host 네트워크가 필요하다.
  # 외부 공개를 막기 위해 docker 브리지 게이트웨이 주소에만 바인딩한다.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: eco-knock-prod-node-exporter
    command:
      - --path.rootfs=/host
      - --web.listen-address=${NODE_EXPORTER_LISTEN_ADDRESS:-172.17.0.1:9100}
      - --collector.systemd
      - --collector.processes
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.0
    container_name: eco-knock-prod-cadvisor
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      # 기본 비활성 목록을 덮어쓰므로 기본값(memory_numa, process, cpuset 등)도 함께 적는다.
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,memory_numa,process,cpuset
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: eco-knock-prod-postgres-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/ecoknock?sslmode=disable
      DATA_SOURCE_USER: ${PROD_POSTGRES_USERNAME}
      DATA_SOURCE_PASS: ${PROD_POSTGRES_PASSWORD}
    command:
      - --collector.long_running_transactions
      - --collector.stat_activity_autovacuum
      - --collector.stat_checkpointer
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.97.0
    container_name: eco-knock-prod-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    container_name: eco-knock-prod-blackbox-exporter
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: eco-knock-prod-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_MASTER_PASSWORD}
      GF_AUTH_BASIC_ENABLED: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${PROD_GRAFANA_HOST}
    ports:
      - "${PROD_GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../shared/grafana/startup.sh:/etc/grafana/startup.sh:ro
      - ../shared/grafana/provisioning:/etc/grafana/provisioning:ro
    entrypoint: [ "sh", "/etc/grafana/startup.sh" ]
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

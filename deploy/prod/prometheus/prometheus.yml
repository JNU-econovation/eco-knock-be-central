global:
  scrape_interval: 15s

scrape_configs:
  - job_name: eco-knock-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "app:18082" ]
        labels:
          environment: prod

  - job_name: eco-knock-embedded
    metrics_path: /metrics
    static_configs:
      - targets: [ "__EMBEDDED_SERVER_HOST__:19996" ]
        labels:
          environment: prod
          service: embedded

  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]
        labels:
          environment: prod

  - job_name: node
    static_configs:
      - targets: [ "host.docker.internal:9100" ]
        labels:
          environment: prod

  - job_name: cadvisor
    static_configs:
      - targets: [ "cadvisor:8080" ]
        labels:
          environment: prod

  - job_name: postgres
    static_configs:
      - targets: [ "postgres-exporter:9187" ]
        labels:
          environment: prod
